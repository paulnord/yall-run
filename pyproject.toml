[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yawl-run"
version = "0.3.0"
description = "Yet Another Workflow Layer: lightweight campaign execution and provenance"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Paul Nord"}]
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
yawl-run = "yawl_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
