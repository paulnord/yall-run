[campaign]
name = "condor-dag-demo"
backend = "condor"

[condor]
request_cpus = 1
request_memory = "1GB"
request_disk = "1GB"

[[task]]
name = "left"
command = ["python3", "-c", "print('left says hello from Condor')"]
retries = 1

[[task]]
name = "right"
command = ["python3", "-c", "print('right says hello from Condor')"]
retries = 1

[[task]]
name = "finish"
command = ["python3", "-c", "print('both parents finished')"]
parents = ["left", "right"]
