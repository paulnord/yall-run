name: payload-wrapper-pid-tweak

on:
  push:
    branches:
      - feat/payload-wrapper

permissions:
  contents: write

jobs:
  tweak-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payload-wrapper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename immediate-child PID and tighten docs/tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/yall_run/worker.py')
          s = p.read_text()
          replacements = [
              ('    command_pid = int(proc.pid)\n', '    launch_pid = int(proc.pid)\n', 1),
              ('    return int(proc.returncode), timing, command_pid\n', '    return int(proc.returncode), timing, launch_pid\n', 1),
              ('            "command_pid": None,\n', '            "launch_pid": None,\n', 2),
              ('            command_returncode, timing, command_pid = _run_command(\n', '            command_returncode, timing, launch_pid = _run_command(\n', 1),
              ('            command_pid = None\n', '            launch_pid = None\n', 1),
              ('        "command_pid": command_pid,\n', '        "launch_pid": launch_pid,\n', 1),
          ]
          for old, new, expected in replacements:
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'worker.py replacement count {count} != {expected}: {old!r}')
              s = s.replace(old, new)
          if 'command_pid' in s:
              raise SystemExit('unexpected command_pid remains in worker.py')
          p.write_text(s)

          p = Path('tests/test_payload_wrapper.py')
          s = p.read_text()
          old = '    assert attempt["command_pid"] is None\n'
          if s.count(old) != 1:
              raise SystemExit('expected one failed-launch command_pid assertion')
          s = s.replace(old, '    assert attempt["launch_pid"] is None\n')
          needle = '    assert record(cdir)["command"] == ["./payload.sh", *arguments]\n    assert record(cdir)["launch_command"][1:] == ["./payload.sh", *arguments]\n'
          replacement = ('    attempt = record(cdir)\n'
                         '    assert attempt["command"] == ["./payload.sh", *arguments]\n'
                         '    assert attempt["launch_command"][1:] == ["./payload.sh", *arguments]\n'
                         '    assert isinstance(attempt["launch_pid"], int)\n'
                         '    assert attempt["launch_pid"] != attempt["worker_pid"]\n')
          if s.count(needle) != 1:
              raise SystemExit('could not locate successful launch PID test insertion point')
          s = s.replace(needle, replacement)
          if 'command_pid' in s:
              raise SystemExit('unexpected command_pid remains in payload wrapper tests')
          p.write_text(s)

          p = Path('docs/PROVENANCE.md')
          s = p.read_text()
          old = ('`launch_command`; `command_pid` identifies the immediate child (the wrapper\n'
                 'when present), not necessarily the final application process. Timing includes\n')
          new = ('`launch_command`; `launch_pid` identifies the host worker\'s immediate child\n'
                 '(the wrapper when present), not necessarily the final application process. Timing includes\n')
          if s.count(old) != 1:
              raise SystemExit('could not locate provenance PID wording')
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('docs/WRAPPERS.md')
          s = p.read_text()
          old = ('command exit code is invented when the process never started.\n\n'
                 'Missing inputs and protected existing outputs fail **before** wrapper invocation.\n')
          new = ('command exit code is invented when the process never started. Final attempt records\n'
                 'call the immediate host child PID `launch_pid`; Yall does not claim that this is the\n'
                 'PID of a process created later inside a container or launcher.\n\n'
                 'Missing inputs and protected existing outputs fail **before** wrapper invocation.\n')
          if s.count(old) != 1:
              raise SystemExit('could not locate wrapper PID documentation insertion point')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Install and test
        run: |
          python -m pip install -e . pytest
          pytest -q
          git diff --check
      - name: Commit tested cleanup and remove transport workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/payload-wrapper-pid-tweak.yml
          git add src/yall_run/worker.py tests/test_payload_wrapper.py docs/PROVENANCE.md docs/WRAPPERS.md
          git commit -m 'Name wrapper process PID as launch_pid'
          git push origin HEAD:feat/payload-wrapper
