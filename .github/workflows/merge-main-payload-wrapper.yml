name: Merge main into payload-wrapper

on:
  push:
    branches:
      - feat/payload-wrapper

permissions:
  contents: write

jobs:
  merge-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payload-wrapper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge main and resolve architecture overlap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true

          echo 'Unmerged paths before resolution:'
          git diff --name-only --diff-filter=U

          # Only these two files have textual conflicts. Other overlapping files
          # auto-merge, then get semantic adjustments below where the old
          # wrapper-around-worker retry design must be adapted to payload wrapping.
          git checkout --ours -- \
            src/yall_run/condor_backend.py \
            src/yall_run/syntax.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          # The model and README auto-merge cleanly. Assert the important pieces
          # from main survived before resolving the genuinely conflicted files.
          model = Path('src/yall_run/model.py').read_text()
          if 'DEFAULT_STARTUP_RETRIES = 2' not in model or 'startup_retries: int = DEFAULT_STARTUP_RETRIES' not in model:
              raise SystemExit('model.py did not retain startup retry policy from main')
          if '- [Retries](docs/RETRIES.md)' not in Path('README.md').read_text():
              raise SystemExit('README did not retain retry documentation link from main')

          # Parser: retain backend-independent ExecutionSpec from PR #20 and add
          # the startup retry syntax from PR #21.
          replace_once(
              'src/yall_run/syntax.py',
              'from .model import CampaignSpec, CondorSpec, ExecutionSpec, FileRef, ResourceSpec, TaskSpec, _validate_graph\n',
              'from .model import CampaignSpec, CondorSpec, DEFAULT_STARTUP_RETRIES, ExecutionSpec, FileRef, ResourceSpec, TaskSpec, _validate_graph\n',
          )
          replace_once(
              'src/yall_run/syntax.py',
              '    retries: int = 0\n    cpus: int | None = None\n',
              '    retries: int = 0\n    startup_retries: int = DEFAULT_STARTUP_RETRIES\n    cpus: int | None = None\n',
          )
          replace_once(
              'src/yall_run/syntax.py',
              '                if current.retries < 0:\n                    raise ValueError(f"line {lineno}: %retry may not be negative")\n            elif directive == "cpus" and len(values) == 1:\n',
              '                if current.retries < 0:\n                    raise ValueError(f"line {lineno}: %retry may not be negative")\n            elif directive == "startup-retry" and len(values) == 1:\n                try:\n                    current.startup_retries = int(values[0])\n                except ValueError:\n                    raise ValueError(\n                        f"line {lineno}: %startup-retry requires an integer"\n                    ) from None\n                if current.startup_retries < 0:\n                    raise ValueError(\n                        f"line {lineno}: %startup-retry may not be negative"\n                    )\n            elif directive == "cpus" and len(values) == 1:\n',
          )
          replace_once(
              'src/yall_run/syntax.py',
              '        retries=template.retries,\n        inputs=tuple(inputs),\n',
              '        retries=template.retries,\n        startup_retries=template.startup_retries,\n        inputs=tuple(inputs),\n',
          )

          # Condor still launches the bundled Python worker on the host. The
          # scheduler-facing launcher clears/checks a marker which is written
          # only after the scientific payload has crossed the wrapper boundary.
          replace_once(
              'src/yall_run/condor_backend.py',
              'from dataclasses import asdict\nimport json\n',
              'from dataclasses import asdict\nimport hashlib\nimport json\n',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              'import re\nimport subprocess\n',
              'import re\nimport shlex\nimport subprocess\n',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '_CLUSTER_RE = re.compile(r"cluster\\s+(\\d+)", re.IGNORECASE)\n_STATUS_NAMES = {\n',
              '_CLUSTER_RE = re.compile(r"cluster\\s+(\\d+)", re.IGNORECASE)\n_STARTUP_FAILURE_EXIT = 100\n_PAYLOAD_FAILURE_EXIT = 101\n_STATUS_NAMES = {\n',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              'def render_condor(spec: CampaignSpec, root: str | Path) -> Path:\n',
              'def _startup_marker(campaign_dir: Path, task_name: str) -> Path:\n'
              '    marker_id = hashlib.sha256(task_name.encode("utf-8")).hexdigest()\n'
              '    return campaign_dir / "condor" / "startup" / f"{marker_id}.started"\n\n\n'
              'def render_condor(spec: CampaignSpec, root: str | Path) -> Path:\n',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '    logs_dir = condor_dir / "logs"\n    logs_dir.mkdir()\n\n    worker_source = ',
              '    logs_dir = condor_dir / "logs"\n    logs_dir.mkdir()\n    startup_dir = condor_dir / "startup"\n    startup_dir.mkdir()\n\n    worker_source = ',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '        node_script = condor_dir / f"{node}.sh"\n'
              '        command = worker_command(worker, campaign_dir, task.name)\n'
              '        node_script.write_text(\n'
              '            "#!/bin/bash\\n"\n'
              '            "set -e\\n"\n'
              '            f"exec {command}\\n"\n'
              '        )\n',
              '        marker = _startup_marker(campaign_dir, task.name)\n'
              '        command = worker_command(worker, campaign_dir, task.name)\n\n'
              '        node_script = condor_dir / f"{node}.sh"\n'
              '        marker_word = shlex.quote(str(marker))\n'
              '        node_script.write_text(\n'
              '            "#!/bin/bash\\n"\n'
              '            "set -u\\n"\n'
              '            f"marker={marker_word}\\n"\n'
              '            "if ! rm -f \\"$marker\\"; then\\n"\n'
              '            "    echo \\"yall: could not clear startup marker: $marker\\" >&2\\n"\n'
              '            f"    exit {_STARTUP_FAILURE_EXIT}\\n"\n'
              '            "fi\\n"\n'
              '            "rc=0\\n"\n'
              '            f"if {command}; then\\n"\n'
              '            "    rc=0\\n"\n'
              '            "else\\n"\n'
              '            "    rc=$?\\n"\n'
              '            "fi\\n"\n'
              '            "if [ ! -e \\"$marker\\" ]; then\\n"\n'
              '            "    echo \\"yall: startup failed before payload marker (worker exit=$rc)\\" >&2\\n"\n'
              '            f"    exit {_STARTUP_FAILURE_EXIT}\\n"\n'
              '            "fi\\n"\n'
              '            "if [ \\"$rc\\" -ne 0 ]; then\\n"\n'
              '            "    echo \\"yall: payload failed after startup (worker exit=$rc)\\" >&2\\n"\n'
              '            f"    exit {_PAYLOAD_FAILURE_EXIT}\\n"\n'
              '            "fi\\n"\n'
              '            "exit 0\\n"\n'
              '        )\n',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '        time_line = f"+MaxRuntime = {walltime}\\n" if walltime is not None else ""\n\n        submit = ',
              '        time_line = f"+MaxRuntime = {walltime}\\n" if walltime is not None else ""\n'
              '        startup_retry_lines = ""\n'
              '        if task.startup_retries:\n'
              '            startup_retry_lines = (\n'
              '                f"max_retries = {task.startup_retries}\\n"\n'
              '                f"retry_until = ExitCode =!= {_STARTUP_FAILURE_EXIT}\\n"\n'
              '                \'requirements = (Machine =!= split(LastRemoteHost, "@")[1])\\n\'\n'
              '            )\n\n'
              '        submit = ',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '            f"{time_line}"\n            f"getenv = ',
              '            f"{time_line}"\n            f"{startup_retry_lines}"\n            f"getenv = ',
          )
          replace_once(
              'src/yall_run/condor_backend.py',
              '        if task.retries:\n            dag_lines.append(f"RETRY {node} {task.retries}")\n',
              '        if task.retries:\n            dag_lines.append(\n                f"RETRY {node} {task.retries} UNLESS-EXIT {_STARTUP_FAILURE_EXIT}"\n            )\n',
          )

          # worker.py auto-merges textually, but PR #21's original marker was
          # written as soon as the worker started. Under PR #20 that is too early:
          # the host worker starts before eic-shell/container setup. Replace it
          # with a marker trampoline which runs inside the payload wrapper.
          replace_once(
              'src/yall_run/worker.py',
              'def _payload_command(command: str | list[str], wrapper: dict[str, Any] | None) -> list[str]:\n'
              '    payload = ["/bin/sh", "-c", command] if isinstance(command, str) else list(command)\n'
              '    if wrapper is not None:\n'
              '        return [str(wrapper["path"]), *wrapper.get("args", []), *payload]\n'
              '    return payload\n',
              'def _payload_command(\n'
              '    command: str | list[str],\n'
              '    wrapper: dict[str, Any] | None,\n'
              '    startup_marker: Path | None = None,\n'
              ') -> list[str]:\n'
              '    payload = ["/bin/sh", "-c", command] if isinstance(command, str) else list(command)\n'
              '    if startup_marker is not None:\n'
              '        entry = \'marker=$1; shift; : > "$marker" || exit 125; exec "$@"\'\n'
              '        payload = [\n'
              '            "/bin/sh", "-c", entry, "yall-payload-start",\n'
              '            str(startup_marker), *payload,\n'
              '        ]\n'
              '    if wrapper is not None:\n'
              '        return [str(wrapper["path"]), *wrapper.get("args", []), *payload]\n'
              '    return payload\n',
          )
          old_marker_block = '''def _startup_marker(campaign_dir: str | Path, task_name: str) -> Path | None:\n    campaign = Path(campaign_dir).expanduser()\n    if not campaign.is_absolute():\n        campaign = Path.cwd() / campaign\n    marker_dir = campaign.absolute() / "condor" / "startup"\n    if not marker_dir.is_dir():\n        return None\n    marker_id = hashlib.sha256(task_name.encode("utf-8")).hexdigest()\n    return marker_dir / f"{marker_id}.started"\n\n\ndef _mark_payload_started(campaign_dir: str | Path, task_name: str) -> bool:\n    marker = _startup_marker(campaign_dir, task_name)\n    if marker is None:\n        return True\n    try:\n        marker.touch()\n    except OSError as exc:\n        print(f"yall-worker: could not write startup marker {marker}: {exc}", file=sys.stderr)\n        return False\n    return True\n\n\n'''
          new_marker_block = '''def _startup_marker(campaign_dir: Path, task_name: str) -> Path | None:\n    marker_dir = campaign_dir / "condor" / "startup"\n    if not marker_dir.is_dir():\n        return None\n    marker_id = hashlib.sha256(task_name.encode("utf-8")).hexdigest()\n    return marker_dir / f"{marker_id}.started"\n\n\ndef _mark_nonstartup_failure(marker: Path | None, stderr_path: Path) -> None:\n    if marker is None:\n        return\n    try:\n        marker.touch()\n    except OSError as exc:\n        with stderr_path.open("a") as err:\n            err.write(f"yall-worker: could not write startup marker {marker}: {exc}\\n")\n\n\n'''
          replace_once('src/yall_run/worker.py', old_marker_block, new_marker_block)
          replace_once(
              'src/yall_run/worker.py',
              '    task = _task_definition(campaign_dir, manifest, task_name)\n\n    number = _next_attempt_number(',
              '    task = _task_definition(campaign_dir, manifest, task_name)\n    startup_marker = _startup_marker(campaign_dir, task_name)\n\n    number = _next_attempt_number(',
          )
          replace_once(
              'src/yall_run/worker.py',
              '    launch_command = _payload_command(command, wrapper)\n',
              '    launch_command = _payload_command(command, wrapper, startup_marker)\n',
          )
          replace_once(
              'src/yall_run/worker.py',
              '        stderr_path.write_text(\n            "yall-worker: declared input missing: " + ", ".join(missing_inputs) + "\\n"\n        )\n        finished = _utc_now()\n',
              '        stderr_path.write_text(\n            "yall-worker: declared input missing: " + ", ".join(missing_inputs) + "\\n"\n        )\n        _mark_nonstartup_failure(startup_marker, stderr_path)\n        finished = _utc_now()\n',
          )
          replace_once(
              'src/yall_run/worker.py',
              '        stderr_path.write_text(\n            "yall-worker: declared output already exists: "\n            + ", ".join(existing_outputs)\n            + "\\n"\n        )\n        finished = _utc_now()\n',
              '        stderr_path.write_text(\n            "yall-worker: declared output already exists: "\n            + ", ".join(existing_outputs)\n            + "\\n"\n        )\n        _mark_nonstartup_failure(startup_marker, stderr_path)\n        finished = _utc_now()\n',
          )
          replace_once(
              'src/yall_run/worker.py',
              '    if not _mark_payload_started(values[0], values[1]):\n        return 2\n',
              '',
          )
          worker = Path('src/yall_run/worker.py').read_text()
          if '"startup_retries": task.get("startup_retries", 0)' not in worker:
              raise SystemExit('worker provenance lost startup_retries during auto-merge')

          # The main-side test assumed wrapper failure prevented worker entry.
          # With payload-only wrapping the host worker records the startup attempt.
          replace_once(
              'tests/test_wrapper_args.py',
              '    assert not (campaign / "one_attempt_001").exists()\n',
              '    first = json.loads((campaign / "one_attempt_001/attempt.json").read_text())\n'
              '    assert first["state"] == "failed"\n'
              '    assert first["command_returncode"] == 37\n',
          )

          # Existing payload-wrapper tests now see Condor's scheduler-facing 100/101
          # classifications while the attempt records retain original return codes.
          p = Path('tests/test_payload_wrapper.py')
          text = p.read_text()
          changes = [
              ('    assert attempt["launch_command"][1:] == ["./payload.sh", *arguments]\n',
               '    assert attempt["launch_command"][-(len(arguments) + 1):] == ["./payload.sh", *arguments]\n'),
              ('    assert run(cdir, backend) == 2\n    assert not marker.exists()\n',
               '    assert run(cdir, backend) == (101 if backend == "condor" else 2)\n    assert not marker.exists()\n'),
              ('    assert run(cdir, backend) == 42\n    assert record(cdir)["state"] == "failed"\n',
               '    assert run(cdir, backend) == (100 if backend == "condor" else 42)\n    assert record(cdir)["state"] == "failed"\n'),
              ('    assert run(cdir, backend) == 2\n    attempt = record(cdir)\n',
               '    assert run(cdir, backend) == (100 if backend == "condor" else 2)\n    attempt = record(cdir)\n'),
              ('    assert run(cdir, backend) == 1\n    assert record(cdir)["failure"]["kind"] == "missing_outputs"\n',
               '    assert run(cdir, backend) == (101 if backend == "condor" else 1)\n    assert record(cdir)["failure"]["kind"] == "missing_outputs"\n'),
              ('    assert run(cdir, backend) == 9\n    first_attempt = ',
               '    assert run(cdir, backend) == (101 if backend == "condor" else 9)\n    first_attempt = '),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f'test_payload_wrapper.py pattern missing: {old!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('tests/test_startup_retry.py')
          text = p.read_text()
          text = text.replace('payload failed after startup (exit=37)',
                              'payload failed after startup (worker exit=37)')
          p.write_text(text)
          PY

          git rm .github/workflows/merge-main-payload-wrapper.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep .; then
            echo 'Unresolved merge conflicts remain' >&2
            exit 1
          fi

      - name: Install and run full test suite
        run: |
          python -m pip install -e . pytest
          pytest -q
          git diff --check

      - name: Commit tested merge and push
        run: |
          git status --short
          git commit -m 'Merge main startup retries into payload wrapper'
          git push origin HEAD:feat/payload-wrapper
