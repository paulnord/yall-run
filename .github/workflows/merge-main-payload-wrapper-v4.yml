name: Merge main into payload-wrapper v4

on:
  push:
    branches:
      - feat/payload-wrapper

permissions:
  contents: write

jobs:
  merge-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/payload-wrapper
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge main and resolve semantics
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          git checkout --ours -- src/yall_run/condor_backend.py src/yall_run/syntax.py
          python tools/resolve_pr20_merge.py
          git rm .github/workflows/merge-main-payload-wrapper.yml
          git rm .github/workflows/merge-main-payload-wrapper-v3.yml
          git rm .github/workflows/merge-main-payload-wrapper-v4.yml
          git rm tools/resolve_pr20_merge.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Run full test suite
        run: |
          python -m pip install -e . pytest
          pytest -q
          git diff --check
      - name: Commit tested merge and push
        run: |
          git commit -m 'Merge main startup retries into payload wrapper'
          git push origin HEAD:feat/payload-wrapper
